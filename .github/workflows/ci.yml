name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ⛔ GO_VERSION IS GONE ON PURPOSE. It held the literal "1.27.3" and the only
# setup-go step read it as `${{ env.GO_VERSION }}`, which is a hard-coded pin
# one indirection away: it drifts from go.mod exactly as a literal does, and
# `setup-go` sets GOTOOLCHAIN=local, so a pin UNDER the directive does not build
# an older toolchain quietly — it REFUSES with `go.mod requires go >= X`.
# Measured 2026-11-15 on five of six go-filesystems repositories: every job red
# at once, for a one-line change to go.mod.
#
# ⚠ And the indirection hid it from the auditor: `gofloor` reports a hard-coded
# `go-version` as a finding but classifies `${{ … }}` merely as "expression", so
# this repository read as clean while its pin sat two patch releases behind the
# floor the fleet was moving to. Three of the five Go repositories in this
# organisation had the same shape.
#
# The step now reads `go-version-file: go.mod`, so the toolchain is the declared
# floor by construction and the next raise needs no edit here.

jobs:
  test:
    name: build · vet · gofmt · test · govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
